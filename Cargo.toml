[package]
name = "krhom"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Hongjian Yang"]
description = "Colored (exterior power) Khovanov-Rozansky gl_N link homology via singular Soergel bimodules and the universal-construction closure"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.8"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
debug = true
