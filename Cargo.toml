[package]
name = "krhom"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Hongjian Yang"]
description = "Colored (exterior power) Khovanov-Rozansky gl_N link homology via singular Soergel bimodules and the universal-construction closure"

[features]
# Developer and diagnostic binaries and examples (library builds, sharded box runs, scans,
# calibration, censuses). `cargo build --release` builds only the calculator `krhom`;
# `cargo build --release --features dev` builds everything.
dev = []

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.8"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
debug = true

# ---- calculator (default) ----
[[bin]]
name = "krhom"
path = "src/bin/krhom.rs"

# ---- developer binaries (feature "dev") ----
[[bin]]
name = "b4wstamp"
path = "src/bin/b4wstamp.rs"
required-features = ["dev"]

[[bin]]
name = "colored_cable"
path = "src/bin/colored_cable.rs"
required-features = ["dev"]

[[bin]]
name = "cube"
path = "src/bin/cube.rs"
